services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: solverthon
      POSTGRES_USER: solverthon
      POSTGRES_PASSWORD: solverthon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solverthon -d solverthon"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - solverthon-db:/var/lib/postgresql/data

volumes:
  solverthon-db:
