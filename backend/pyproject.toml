[project]
name = "solverthon-backend"
version = "0.1.0"
description = "AI Solverthon Bizinfo eligibility API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pypdf>=6,<7",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "pypdfium2>=5,<6",
  "pillow>=11,<13",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
